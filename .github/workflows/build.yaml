name: Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      # cross compiles every target the release builds, and validates the release
      # config, so neither can break for the first time while cutting a tag
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: '~> v2'
          args: build --snapshot --clean
